name: Extract AUTO CHECK

on:
  push:
    branches:
      - hauptsächlich
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: ZIP entpacken
        run: |
          mkdir -p extracted
          unzip -o AUTO_CHECK_Drivers_v0.2.zip -d extracted

      - name: AUTO CHECK Dateien ins Repository kopieren
        run: |
          if [ -d "extracted/auto-check" ]; then
            cp -R extracted/auto-check/. .
          else
            cp -R extracted/. .
          fi

          rm -rf extracted
          rm -f AUTO_CHECK_Drivers_v0.2.zip

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
          else
            git commit -m "AUTO CHECK Code aus ZIP entpackt"
            git push
          fi
